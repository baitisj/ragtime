<svg xmlns="http://www.w3.org/2000/svg" width="760" height="380" viewBox="0 0 760 380" font-family="Helvetica, Arial, sans-serif" role="img" aria-label="Three listeners each lost a different piece of a six-piece file. Sending the lost pieces again takes three pieces; one parity piece fills all three gaps.">
  <rect width="760" height="380" fill="#ffffff"/>

  <text x="20" y="28" font-size="16" font-weight="bold" fill="#1d2129">One parity piece, three different gaps</text>

  <!-- Column heads -->
  <g font-size="12" fill="#4a515c" text-anchor="middle">
    <text x="133" y="58">1</text><text x="171" y="58">2</text><text x="209" y="58">3</text>
    <text x="247" y="58">4</text><text x="285" y="58">5</text><text x="323" y="58">6</text>
  </g>
  <text x="228" y="44" font-size="12" fill="#4a515c" text-anchor="middle">pieces of the file</text>

  <!-- Lane labels -->
  <g font-size="14" font-weight="bold" fill="#1d2129">
    <text x="20" y="88">AG7EW</text>
    <text x="20" y="148">KC2G</text>
    <text x="20" y="198">K7RAG</text>
    <text x="20" y="248">W1AW</text>
  </g>

  <!-- Sender's pieces -->
  <g fill="#cfd3da">
    <rect x="116" y="68" width="34" height="28" rx="4"/><rect x="154" y="68" width="34" height="28" rx="4"/>
    <rect x="192" y="68" width="34" height="28" rx="4"/><rect x="230" y="68" width="34" height="28" rx="4"/>
    <rect x="268" y="68" width="34" height="28" rx="4"/><rect x="306" y="68" width="34" height="28" rx="4"/>
  </g>

  <!-- Listeners: held pieces grey, the lost one an empty red box -->
  <g fill="#cfd3da">
    <rect x="116" y="128" width="34" height="28" rx="4"/>
    <rect x="192" y="128" width="34" height="28" rx="4"/><rect x="230" y="128" width="34" height="28" rx="4"/>
    <rect x="268" y="128" width="34" height="28" rx="4"/><rect x="306" y="128" width="34" height="28" rx="4"/>

    <rect x="116" y="178" width="34" height="28" rx="4"/><rect x="154" y="178" width="34" height="28" rx="4"/>
    <rect x="192" y="178" width="34" height="28" rx="4"/>
    <rect x="268" y="178" width="34" height="28" rx="4"/><rect x="306" y="178" width="34" height="28" rx="4"/>

    <rect x="116" y="228" width="34" height="28" rx="4"/><rect x="154" y="228" width="34" height="28" rx="4"/>
    <rect x="192" y="228" width="34" height="28" rx="4"/><rect x="230" y="228" width="34" height="28" rx="4"/>
    <rect x="306" y="228" width="34" height="28" rx="4"/>
  </g>
  <g fill="#ffffff" stroke="#b42318" stroke-width="2" stroke-dasharray="4 3">
    <rect x="154" y="128" width="34" height="28" rx="4"/>
    <rect x="230" y="178" width="34" height="28" rx="4"/>
    <rect x="268" y="228" width="34" height="28" rx="4"/>
  </g>
  <g font-size="12" fill="#b42318" text-anchor="middle">
    <text x="171" y="147">lost</text><text x="247" y="197">lost</text><text x="285" y="247">lost</text>
  </g>

  <!-- The old way -->
  <rect x="392" y="62" width="348" height="92" rx="6" fill="#f1f2f4"/>
  <text x="406" y="84" font-size="13" font-weight="bold" fill="#1d2129">Ragtime 0.1: the pieces themselves</text>
  <g fill="#cfd3da">
    <rect x="406" y="98" width="34" height="28" rx="4"/><rect x="444" y="98" width="34" height="28" rx="4"/>
    <rect x="482" y="98" width="34" height="28" rx="4"/>
  </g>
  <g font-size="12" fill="#1d2129" text-anchor="middle">
    <text x="423" y="117">2</text><text x="461" y="117">4</text><text x="499" y="117">5</text>
  </g>
  <text x="530" y="117" font-size="12" fill="#1d2129">3 pieces: each fills one gap</text>
  <text x="406" y="144" font-size="12" fill="#4a515c">and each listener sits through the two it holds</text>

  <!-- The parity way -->
  <rect x="392" y="170" width="348" height="92" rx="6" fill="#e7f4ea"/>
  <text x="406" y="192" font-size="13" font-weight="bold" fill="#1d2129">Now: parity</text>
  <rect x="406" y="206" width="34" height="28" rx="4" fill="#a9d4b4"/>
  <text x="423" y="225" font-size="12" font-weight="bold" fill="#1d2129" text-anchor="middle">P</text>
  <text x="452" y="225" font-size="12" fill="#1d2129">1 piece: a sum over all six</text>
  <text x="406" y="252" font-size="12" fill="#1e6b34">each listener solves it for the one piece it lacks</text>

  <!-- How -->
  <text x="20" y="300" font-size="13" font-weight="bold" fill="#1d2129">Why it works</text>
  <text x="20" y="322" font-size="12" fill="#1d2129">P = c1·#1 + c2·#2 + … + c6·#6, one equation over all six pieces. A listener holding five of them</text>
  <text x="20" y="340" font-size="12" fill="#1d2129">knows every term but one, so it can solve for the missing piece. Lacking two, it needs two different</text>
  <text x="20" y="358" font-size="12" fill="#1d2129">parity pieces: any two. So a round sends what the neediest listener lacks, not everyone's gaps added up.</text>
</svg>
