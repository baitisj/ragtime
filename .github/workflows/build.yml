name: Build and test

# Each PR gets the quick Ubuntu build and tests. The rest (GCC 16, Windows,
# AppImage) runs only when started by hand: Actions > Build and test >
# Run workflow, which runs every job. Jeff chose this on 2026-10-22, since
# threads build, test and run tools/gcc16/check.py before every push.
on:
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    name: Linux (Ubuntu 24.04, GCC 13)
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
    - name: Install packages
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake libwxgtk3.2-dev libgtk-3-dev
    - name: Build
      run: |
        cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
        cmake --build build -j$(nproc)
    - name: Test
      run: ctest --test-dir build --output-on-failure

  gcc16:
    # Jeff builds with GCC 16, which warns about things GCC 13 doesn't.
    # -O2 and -O3 flag different things, so both run, with -Werror.
    name: GCC 16 -Werror (${{ matrix.build_type }})
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    container: gcc:16
    strategy:
      fail-fast: false
      matrix:
        build_type: [Release, RelWithDebInfo]
    steps:
    - uses: actions/checkout@v4
    - name: Install packages
      run: |
        apt-get update
        apt-get install -y --no-install-recommends cmake make libwxgtk3.2-dev libgtk-3-dev
    - name: Build
      run: |
        # The image's GCC 16 is in /usr/local/bin; never let Debian's g++ in.
        /usr/local/bin/g++ --version | head -1 | grep -q ' 16\.'
        cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DRAGTIME_WERROR=ON \
          -DCMAKE_CXX_COMPILER=/usr/local/bin/g++
        cmake --build build -j$(nproc)
    - name: Test
      run: ctest --test-dir build --output-on-failure

  windows:
    # The portable Windows zip, cross-compiled with MinGW-w64 against a
    # static wxWidgets, and the unit tests run as Windows programs under Wine.
    name: Windows (MinGW-w64 cross build, tests under Wine)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
    - name: Install packages
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends cmake make git zip \
          g++-mingw-w64-x86-64-posix wine wine64
    - name: Build and zip
      run: packaging/windows/make-zip.sh
    - name: Test under Wine
      env:
        WINEDEBUG: -all
      run: ctest --test-dir build-win --output-on-failure
    - name: Checksum
      # Printed in the log and the run summary, to check a downloaded
      # artifact against before it goes into a release.
      run: (cd dist && sha256sum *.zip) | tee -a "$GITHUB_STEP_SUMMARY"
    - uses: actions/upload-artifact@v4
      with:
        name: ragtime-windows-x86_64
        path: dist/*.zip
        if-no-files-found: error

  appimage:
    name: Linux AppImage
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
    - name: Install packages
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake curl file libwxgtk3.2-dev libgtk-3-dev
    - name: Build the AppImage
      run: packaging/linux/make-appimage.sh
    - name: Checksum
      run: (cd dist && sha256sum *.AppImage) | tee -a "$GITHUB_STEP_SUMMARY"
    - uses: actions/upload-artifact@v4
      with:
        name: ragtime-appimage-x86_64
        path: dist/*.AppImage
        if-no-files-found: error
